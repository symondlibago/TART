# Render blueprint for the Event Tracker API.
#
# The frontend lives on Vercel, so only the Laravel API is deployed here.
#
# You can either use this file (Render -> New -> Blueprint) or create the
# service by hand (Render -> New -> Web Service); DEPLOY.md walks through the
# manual route. Values marked sync:false are secrets you paste in the
# dashboard - they are deliberately not in this file.
#
# Region: pick the one closest to the Supabase project (Tokyo). Every query is
# a network round trip, so a backend in the US would add ~150ms to each one.

services:
  - type: web
    name: event-tracker-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Event Tracker
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false            # php artisan key:generate --show
      - key: APP_URL
        sync: false            # the URL Render gives this service
      - key: APP_BUSINESS_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr          # Render collects stdout/stderr
      - key: LOG_LEVEL
        value: warning

      # Supabase Postgres - session pooler (IPv4), port 5432
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_PERSISTENT
        value: "true"
      - key: DB_EMULATE_PREPARES
        value: "true"

      # Supabase Storage for attendance photos
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: attendance

      # The Vercel frontend. Comma separated, no trailing slash. Must match
      # exactly or the browser blocks every API call with a CORS error.
      - key: FRONTEND_URL
        sync: false

      # Set to "true" for the first deploy and whenever migrations change.
      - key: RUN_MIGRATIONS
        value: "false"

      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
