; Attendance photos arrive as base64 JSON, so the body can be a few MB.
post_max_size = 12M
upload_max_filesize = 12M
memory_limit = 256M
max_execution_time = 60

expose_php = Off

; Opcache matters a lot here: without it every request re-parses the framework.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code cannot change inside a running container, so skip the stat() calls.
opcache.validate_timestamps = 0
opcache.save_comments = 1
